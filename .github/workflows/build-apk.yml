name: Build Android APK (C NDK)

on:
  push:
    branches-ignore: [ "ci-diagnostics" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # persist-credentials: false หลีกเลี่ยงขั้นตอน Post checkout ที่เคยทำให้
      # git exit 128 บน runner (ไม่ต้องเขียน/ลบ extraheader)
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmake;3.22.1" \
            "ndk;26.1.10909125"

      # ปิด Gradle cache เพราะบริการ cache ของ GitHub ชั่วคราวมีปัญหา
      # (Cache service responded with 400 / Our services aren't available)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Build Debug APK
        shell: bash
        run: |
          LOG=/tmp/gradle-build.log
          rc=1
          if [ -f "settings.gradle" ]; then
            gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee "$LOG"
            rc=${PIPESTATUS[0]}
          elif [ -f "mobile_c_app/settings.gradle" ]; then
            cd mobile_c_app
            gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee "$LOG"
            rc=${PIPESTATUS[0]}
          else
            echo "settings.gradle not found" | tee "$LOG" >&2
          fi
          if [ "$rc" -ne 0 ]; then
            {
              echo "### Build failure output"
              echo '```text'
              tail -n 160 "$LOG"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            tail -n 45 "$LOG" \
              | while IFS= read -r line; do
                  safe=$(printf '%s' "$line" | cut -c1-300)
                  echo "::error::$safe"
                done
          fi
          exit "$rc"

      # เก็บ log ไว้บน branch ci-diagnostics เพื่อดู error จาก build ที่ล้มเหลวได้โดยไม่ต้องล็อกอิน
      - name: Publish failure log branch
        if: failure()
        shell: bash
        run: |
          [ -f /tmp/gradle-build.log ] || exit 0
          cd "$GITHUB_WORKSPACE"
          git config user.name "CI Diagnostics"
          git config user.email "ci@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git checkout -B ci-diagnostics
          cp /tmp/gradle-build.log gradle-failure.log
          git add -f gradle-failure.log
          if git diff --cached --quiet; then
            echo "Log unchanged"
          else
            git commit -m "CI failure log"
            git push --force origin ci-diagnostics
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RobloxDashboardC-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            mobile_c_app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
