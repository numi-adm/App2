name: Build Android APK (C NDK)

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # persist-credentials: false หลีกเลี่ยงขั้นตอน Post checkout ที่เคยทำให้
      # git exit 128 บน runner (ไม่ต้องเขียน/ลบ extraheader)
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmake;3.22.1" \
            "ndk;26.1.10909125"

      # ปิด Gradle cache เพราะบริการ cache ของ GitHub ชั่วคราวมีปัญหา
      # (Cache service responded with 400 / Our services aren't available)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Build Debug APK
        shell: bash
        run: |
          if [ -f "settings.gradle" ]; then
            gradle assembleDebug --no-daemon --stacktrace
          elif [ -f "mobile_c_app/settings.gradle" ]; then
            cd mobile_c_app && gradle assembleDebug --no-daemon --stacktrace
          else
            echo "settings.gradle not found" >&2
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RobloxDashboardC-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            mobile_c_app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
